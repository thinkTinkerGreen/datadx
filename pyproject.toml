[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadx"
version = "0.1.0"
description = "State-of-the-Art Data Diagnosis and Cleaning Toolkit for Multilingual LLM Pre-training"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pyarrow>=17.0.0",
    "regex>=2024.5.15",
    "ftfy>=6.2.0",
    "phonenumbers>=8.13.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typing_extensions>=4.10.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "pip-audit>=2.7.3",
]

[project.scripts]
diagnose = "datadx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datadx"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "datadx.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "regex.*",
    "ftfy.*",
    "phonenumbers.*",
    "torch.*",
    "hypothesis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/datadx"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
